services:
  ranking_server:
    build: .
    container_name: ranking_service
    command: ["uv", "-q", "run", "python3", "-m", "ranking_service.app.server"]
    ports:
      - "50053:50051"
    volumes:
      - ./config.docker.toml:/app/config.toml:ro
    networks:
      - dating_bot_net
    external_links:
      - dating_bot_valkey:valkey
      - dating_bot_rabbitmq:rabbitmq
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 5s
      retries: 3

  ranking_postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: ranking
      POSTGRES_PASSWORD: ranking
      POSTGRES_DB: ranking
    volumes:
      - ranking_pgdata:/var/lib/postgresql/data
    networks:
      - dating_bot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ranking"]
      interval: 5s
      timeout: 3s

  ranking_celery:
    build: .
    container_name: ranking_celery
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "ranking_service.app.celery",
        "worker",
        "--loglevel=info",
      ]
    volumes:
      - ./config.docker.toml:/app/config.toml:ro
    networks:
      - dating_bot_net
    external_links:
      - dating_bot_valkey:valkey
    depends_on:
      - ranking_postgres
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=redis://valkey:6379/0

networks:
  dating_bot_net:
    external: true
    name: dating_bot_net

volumes:
  ranking_pgdata:
